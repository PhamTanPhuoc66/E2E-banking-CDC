version: 2

models:
  - name: stg_customers
    columns:
      - name: customer_id
        tests:
          - unique
          - not_null
      - name: email
        tests:
          - unique
          - not_null

  - name: stg_accounts
    columns:
      - name: account_id
        tests:
          - unique
          - not_null
      - name: customer_id
        tests:
          - not_null
          # Kiểm tra xem customer_id này có tồn tại trong bảng khách hàng không
          - relationships:
              to: ref('stg_customers')
              field: customer_id
      - name: account_type
        tests:
          # Chỉ chấp nhận 2 loại tài khoản này
          - accepted_values:
              values: ['SAVINGS', 'CHECKING']

  - name: stg_transactions
    columns:
      - name: transaction_id
        tests:
          - unique
          - not_null
      - name: account_id
        tests:
          - not_null
          - relationships:
              to: ref('stg_accounts')
              field: account_id
      - name: txn_type
        tests:
          - accepted_values:
              values: ['DEPOSIT', 'WITHDRAWAL', 'TRANSFER']